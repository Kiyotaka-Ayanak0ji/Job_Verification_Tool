services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    depends_on: [mongo, redis]
    ports: ["8000:8000"]
  ml:
    build: ./ml-service
    environment:
      - PORT=8001
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
    ports: ["8001:8001"]
volumes:
  mongo-data:
